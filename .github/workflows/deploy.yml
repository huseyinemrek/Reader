name: Deploy to Oracle Cloud VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH ile VPS'e bağlan ve güncelle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "--- Kod güncelleniyor ---"
            if [ ! -d "$HOME/reader" ]; then
                echo "--- Depo klonlanıyor ---"
                git clone https://github.com/huseyinemrek/Reader.git "$HOME/reader"
            fi
            cd "$HOME/reader"
            git pull origin main

            echo "--- Ortak Node.js bağımlılıkları güncelleniyor ---"
            npm --prefix local ci --omit=dev

            # İlk geçişte veriler kopyalanırken eski servisin kitap yazmasını durdur.
            # Kaynak local/library.json, uploads ve CPU .venv-ocr silinmez.
            if [ ! -f vps/library.json ] && [ -f local/library.json ]; then
                if pm2 describe reader > /dev/null 2>&1; then
                    pm2 stop reader
                fi
            fi
            npm --prefix vps run migrate

            if ! command -v uv > /dev/null 2>&1 && [ ! -f "$HOME/.local/bin/uv" ]; then
                echo "--- uv kuruluyor ---"
                curl -LsSf https://astral.sh/uv/install.sh | sh
            fi
            export PATH="$HOME/.local/bin:$PATH"

            # Oracle Ubuntu 26.04 Ampere ARM64: VPS CPU OCR korunur, CUDA kurulmaz.
            # Mevcut Python ortamı yeniden yaratılmaz.
            if [ ! -x local/.venv-ocr/bin/python ]; then
                echo "--- CPU belge OCR ortamı ve modelleri hazırlanıyor ---"
                npm --prefix vps run ocr:setup
            fi

            echo "--- Paylaşılan VPS servisi başlatılıyor ---"
            pm2 startOrReload vps/ecosystem.config.cjs --update-env
            pm2 save
            echo "--- Dağıtım başarıyla tamamlandı ---"
