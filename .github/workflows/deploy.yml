name: Deploy to Oracle Cloud VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH ile VPS'e bağlan ve güncelle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "--- Kod güncelleniyor ---"
            if [ ! -d "$HOME/reader" ]; then
                echo "--- Depo klonlanıyor ---"
                git clone https://github.com/huseyinemrek/Reader.git "$HOME/reader"
            fi
            cd "$HOME/reader"
            git pull origin main

            echo "--- Node.js bağımlılıkları güncelleniyor ---"
            cd local
            npm install --omit=dev

            echo "--- PM2 servisi yeniden başlatılıyor ---"
            if pm2 describe reader > /dev/null 2>&1; then
                pm2 restart reader --update-env
            else
                pm2 start server.js --name reader
            fi
            pm2 save
            echo "--- Dağıtım başarıyla tamamlandı ---"
