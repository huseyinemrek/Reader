name: Deploy VPS and Firebase Hosting
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-vps:
    name: Deploy to Oracle Cloud VPS
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - name: SSH ile VPS'e bağlan ve güncelle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "--- Kod güncelleniyor ---"
            if [ ! -d "$HOME/reader" ]; then
                echo "--- Depo klonlanıyor ---"
                git clone https://github.com/huseyinemrek/Reader.git "$HOME/reader"
            fi
            cd "$HOME/reader"
            git pull origin main

            echo "--- Ortak Node.js bağımlılıkları güncelleniyor ---"
            npm --prefix local ci --omit=dev

            # İlk geçişte veriler kopyalanırken eski servisin kitap yazmasını durdur.
            # Kaynak local/library.json, uploads ve CPU .venv-ocr silinmez.
            if [ ! -f vps/library.json ] && [ -f local/library.json ]; then
                if pm2 describe reader > /dev/null 2>&1; then
                    pm2 stop reader
                fi
            fi
            npm --prefix vps run migrate

            if ! command -v uv > /dev/null 2>&1 && [ ! -f "$HOME/.local/bin/uv" ]; then
                echo "--- uv kuruluyor ---"
                curl -LsSf https://astral.sh/uv/install.sh | sh
            fi
            export PATH="$HOME/.local/bin:$PATH"

            # Oracle Ubuntu 26.04 Ampere ARM64: VPS CPU OCR korunur, CUDA kurulmaz.
            # Mevcut Python ortamı yeniden yaratılmaz.
            if [ ! -x local/.venv-ocr/bin/python ]; then
                echo "--- CPU belge OCR ortamı ve modelleri hazırlanıyor ---"
                npm --prefix vps run ocr:setup
            fi

            echo "--- Paylaşılan VPS servisi başlatılıyor ---"
            pm2 startOrReload vps/ecosystem.config.cjs --update-env
            pm2 save
            echo "--- Dağıtım başarıyla tamamlandı ---"

  deploy-hosting:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hosting
      cancel-in-progress: false

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Firebase yapılandırmasını ve projesini hazırla
        env:
          FIREBASE_CONFIG_CONTENT: ${{ secrets.FIREBASE_CONFIG_JS }}
        run: |
          mkdir -p hosting/public
          if [ -n "$FIREBASE_CONFIG_CONTENT" ]; then
            printf '%s\n' "$FIREBASE_CONFIG_CONTENT" > hosting/public/firebase-config.js
          fi
          echo '{"projects":{"default":"book-reader-upload"}}' > hosting/.firebaserc

      - name: Firebase Hosting canlıya dağıt
        working-directory: hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx --yes firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"
